<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flite</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f0; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 8px 12px;
        font: 13px/1.5 ui-monospace, Menlo, monospace; color: #fff;
        background: rgba(20, 30, 40, 0.55); border-radius: 6px; white-space: pre;
        pointer-events: none;
      }
      #help {
        position: fixed; bottom: 12px; left: 12px; padding: 6px 10px;
        font: 12px/1.5 ui-monospace, Menlo, monospace; color: #fff;
        background: rgba(20, 30, 40, 0.45); border-radius: 6px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="help">↑/W throttle · ↓/S brake (hold when stopped = reverse) · ←→/AD steer · R reset · C camera · P feel/sim · M mute · T telemetry rec/save</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
