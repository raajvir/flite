<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flite</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f0; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 8px 12px;
        font: 13px/1.5 ui-monospace, Menlo, monospace; color: #fff;
        background: rgba(20, 30, 40, 0.55); border-radius: 6px; white-space: pre;
        pointer-events: none;
      }
      #center {
        position: fixed; top: 30%; left: 0; right: 0; text-align: center; pointer-events: none;
        font: 700 96px/1 ui-sans-serif, system-ui, sans-serif; color: #fff;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      }
      #center::after {
        content: attr(data-sub); display: block; margin-top: 14px;
        font: 600 18px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      #help {
        position: fixed; top: 12px; right: 12px; max-width: 420px; padding: 6px 10px;
        font: 12px/1.5 ui-monospace, Menlo, monospace; color: #fff;
        background: rgba(20, 30, 40, 0.45); border-radius: 6px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="center"></div>
    <div id="help">↑/W throttle · ↓/S brake (hold when stopped = reverse) · ←→/AD steer · Shift ERS boost · Esc pause · Z rewind 5 s · R back on track · Backspace restart · C camera · V map · B mirror · L braking line · P feel/sim · O tuning · M mute · T telemetry rec/save</div>
    <script>
      // If the game crashes, show the error instead of a blank screen.
      function showFatal(msg) {
        var el = document.getElementById('fatal') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'fatal' }));
        el.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;padding:12px;background:#300;color:#fdd;font:12px ui-monospace,monospace;white-space:pre-wrap;z-index:99;border-radius:8px';
        el.textContent = 'Something went wrong:\n' + msg;
      }
      window.addEventListener('error', function (e) { showFatal((e.error && e.error.stack) || e.message); });
      window.addEventListener('unhandledrejection', function (e) { showFatal((e.reason && e.reason.stack) || String(e.reason)); });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
